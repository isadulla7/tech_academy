<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tech Academy — Android & Fintech Senior Learning</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">
<aside class="sidebar">
<div class="brand">
  <strong>Tech Academy</strong>
  <span>Android + Java + Fintech</span>
</div>
<input id="search" class="search" type="search" placeholder="Mavzu yoki ID qidiring (masalan: COR-004)">
<div class="nav-shortcuts">
  <button class="shortcut-btn" id="navDashboard" data-route="/">📊 Dashboard</button>
  <button class="shortcut-btn" id="navGraph" data-route="/graph">🕸️ Knowledge Graph</button>
  <button class="shortcut-btn" id="navResume" data-route="/resume">💼 Resume Mapping</button>
  <button class="shortcut-btn" id="navReview" data-route="/review">🔄 Revision</button>
</div>
<div class="modules-header-bar">
  <div class="modules-header">Mundarija (17 ta Modul)</div>
  <button id="toggleAllBtn" class="toggle-all-btn" type="button">Barchasini ochish</button>
</div>
<nav id="modules" class="modules"></nav>
</aside>
<main class="main">
<header class="topbar">
<button id="menuBtn" class="icon-btn" type="button">☰</button>
<div id="crumb" class="crumb">Dashboard</div>
<div class="top-actions">
  <button id="topGraphBtn" type="button">🕸️ Graph</button>
  <button id="topResumeBtn" type="button">💼 Resume</button>
  <button id="reviewBtn" type="button">🔄 Revision</button>
  <button id="mockBtn" type="button">🎯 Sinov</button>
</div>
</header>
<section id="view" class="view"></section>
</main>
</div>
<div id="modal" class="modal" hidden>
  <div class="modal-card">
    <button id="closeModal" class="modal-close" type="button">×</button>
    <div id="modalBody"></div>
  </div>
</div>
<script src="data/lessons.js"></script>
<script src="js/app.js"></script>
</body>
</html>
